[package]
name = "tempgrpcd"
version = "0.1.0"
edition = "2021"
build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
common = { path = "../common" }
prost = "0.13"
redis = { version = "0.27", features = ["connection-manager", "tokio-comp", "streams"] }
scopeguard = "1.2"
tokio = { version = "1.39", features = ["full"] }
tokio-util = "0.7"
tonic = "0.12"
tonic-reflection = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
