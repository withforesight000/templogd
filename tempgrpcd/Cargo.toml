[package]
name = "tempgrpcd"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
askama = "0.14"
clap = { version = "4.5", features = ["derive", "env"] }
common = { path = "../common" }
prost = "0.14"
redis = { version = "0.32", features = ["connection-manager", "tokio-comp", "streams"] }
scopeguard = "1.2"
tempgrpcd-protos = { git = "ssh://gitea/ryuichiro/protobuf-rust.git", package = "tempgrpcd-protos" }
tokio = { version = "1.39", features = ["full"] }
tokio-util = "0.7"
tonic = "0.14"
tonic-reflection = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.14"
