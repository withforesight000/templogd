[package]
name = "tempgrpcd"
version = "0.1.0"
edition = "2021"
build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
common = { path = "../common" }
prost = "0.12"
redis = { version = "0.25", features = ["connection-manager", "tokio-comp", "streams"] }
tokio = { version = "1.37", features = ["full"] }
tonic = "0.11"
tonic-reflection = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.11"
