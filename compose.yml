version: '3'
services:
  templogd:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: templogd
    image: ghcr.io/withforesight000/templogd:latest
    restart: always
    environment:
      - TEMPLOGD_NATURE_REMO_API_TOKEN=XXX
      - TEMPLOGD_NATURE_REMO_DEVICE_ID=XXX
      - TEMPLOGD_REDIS_HOST=redis
      - TEMPLOGD_REDIS_PORT=6379
      - TEMPLOGD_LOG_FORMAT=${TEMPLOGD_LOG_FORMAT:-json}
      - TEMPLOGD_LOG_LEVEL=${TEMPLOGD_LOG_LEVEL:-info}

  tempgrpcd:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: tempgrpcd
    image: ghcr.io/withforesight000/tempgrpcd:latest
    restart: always
    environment:
      - TEMPGRPCD_SERVER_BIND_ADDRESS=0.0.0.0
      - TEMPGRPCD_SERVER_PORT=50051
      - TEMPGRPCD_BEARER_TOKEN=XXX
      - TEMPGRPCD_REDIS_HOST=redis
      - TEMPGRPCD_REDIS_PORT=6379
      - TEMPGRPCD_LOG_FORMAT=${TEMPGRPCD_LOG_FORMAT:-json}
      - TEMPGRPCD_LOG_LEVEL=${TEMPGRPCD_LOG_LEVEL:-info}
    ports:
      - 50051:50051

  redis:
    image: redis:7.2
    restart: always
    volumes:
      - redis-data:/data

volumes:
  redis-data:
