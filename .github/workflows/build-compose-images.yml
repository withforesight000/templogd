name: Build Compose Images

on:
  workflow_call:
    secrets:
      DHI_USERNAME:
        required: true
      DHI_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Validate publication tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Select Docker tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push ]]; then
            echo '::error::Images can only be published for push events.'
            exit 1
          fi
          if [[ "$SOURCE_REF" == refs/heads/master ]]; then
            tag=latest
          elif [[ "$SOURCE_REF" == refs/tags/* ]]; then
            tag="$SOURCE_TAG"
            if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$tag" == latest ]]; then
              echo '::error::Git tag must be a valid Docker tag (1-128 ASCII characters); latest is reserved for master.'
              exit 1
            fi
          else
            echo '::error::Images can only be published from master or a Git tag.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.service }}, ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        service: [templogd, tempgrpcd]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/withforesight000/${{ matrix.service }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to DHI
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/withforesight000/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
          pull: true
      - name: Verify published runtime image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE@$DIGEST"
          docker pull "$image"
          docker image inspect "$image" | jq -e --arg revision "$REVISION" --arg binary "/usr/local/bin/$SERVICE" '
            .[0].Config | .User == "65532:65532" and
            ((.Entrypoint // []) == []) and .Cmd == [$binary] and
            .Labels["org.opencontainers.image.revision"] == $revision'
          docker run --rm --network none --entrypoint "/usr/local/bin/$SERVICE" "$image" --help
          container=$(docker create "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/etc/ssl/certs/ca-certificates.crt" "$RUNNER_TEMP/ca-certificates.crt"
          grep -q -- '-----BEGIN CERTIFICATE-----' "$RUNNER_TEMP/ca-certificates.crt"
      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${SERVICE}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  create-manifest:
    name: Create multi-arch manifests
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify manifests
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for service in templogd tempgrpcd; do
            image="ghcr.io/withforesight000/$service"
            amd64=$(cat "$RUNNER_TEMP/digests/$service-amd64")
            arm64=$(cat "$RUNNER_TEMP/digests/$service-arm64")
            [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools create --tag "$image:$IMAGE_TAG" "$image@$amd64" "$image@$arm64"
            docker buildx imagetools inspect --raw "$image:$IMAGE_TAG" | jq -e \
              --arg amd64 "$amd64" --arg arm64 "$arm64" '
                (.manifests | length) == 2 and
                any(.manifests[]; .digest == $amd64 and .platform.os == "linux" and .platform.architecture == "amd64") and
                any(.manifests[]; .digest == $arm64 and .platform.os == "linux" and .platform.architecture == "arm64")'
          done
