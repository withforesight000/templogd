name: Build Compose Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs_on: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runs_on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: latest-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "arch=${{ matrix.arch }}"
          uname -a
          docker --version

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push templogd
        uses: docker/build-push-action@v6
        with:
          context: .
          target: templogd
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/withforesight000/templogd:${{ env.IMAGE_TAG }}
          provenance: false
          cache-from: type=gha,scope=templogd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=templogd-${{ matrix.arch }}

      - name: Build and push tempgrpcd
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tempgrpcd
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/withforesight000/tempgrpcd:${{ env.IMAGE_TAG }}
          provenance: false
          cache-from: type=gha,scope=tempgrpcd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tempgrpcd-${{ matrix.arch }}

  create-manifest:
    name: Create multi-arch manifests
    runs-on: ubuntu-latest
    needs: build

    permissions:
      packages: write

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push templogd manifest
        run: |
          docker manifest create \
            ghcr.io/withforesight000/templogd:latest \
            ghcr.io/withforesight000/templogd:latest-amd64 \
            ghcr.io/withforesight000/templogd:latest-arm64
          docker manifest push ghcr.io/withforesight000/templogd:latest

      - name: Create and push tempgrpcd manifest
        run: |
          docker manifest create \
            ghcr.io/withforesight000/tempgrpcd:latest \
            ghcr.io/withforesight000/tempgrpcd:latest-amd64 \
            ghcr.io/withforesight000/tempgrpcd:latest-arm64
          docker manifest push ghcr.io/withforesight000/tempgrpcd:latest
