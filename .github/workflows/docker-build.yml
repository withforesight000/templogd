name: Docker Build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build `templogd` target
        run: |
          docker build --progress=plain --target templogd -t templogd:ci .
      - name: Build `tempgrpcd` target
        run: |
          docker build --progress=plain --target tempgrpcd -t tempgrpcd:ci .
