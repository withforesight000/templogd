name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add clippy
        run: rustup component add clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test_coverage:
    name: Run tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: cargo-bins/cargo-binstall@main
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Install LLVM (for coverage)
        run: sudo apt-get update && sudo apt-get install -y llvm clang lld
      - name: Install cargo-llvm-cov
        run: cargo binstall cargo-llvm-cov --locked --force --no-confirm
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --no-clean
      - name: Print human-readable coverage summary
        run: cargo llvm-cov --workspace --no-clean --text --show-missing-lines || true
